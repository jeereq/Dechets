services:
  postgres:
    image: postgres:16-alpine
    container_name: benime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: benime
      POSTGRES_PASSWORD: benime
      POSTGRES_DB: benime
    ports:
      - '5432:5432'
    volumes:
      - benime-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U benime']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  benime-pgdata:
